# SPDX-License-Identifier: CC0-1.0
#
# Official systemd units manipulation for X64 LIOS Linux
---

units:
  # Network & Time
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false

  - name: "systemd-timesyncd.service"
    action: "enable"
    mandatory: false

  - name: "cachyos-iw-set-regdomain.path"
    action: "enable"
    mandatory: false

  # Performance & Power
  - name: "ananicy-cpp.service"
    action: "enable"
    mandatory: false

  - name: "falcond.service"
    action: "enable"
    mandatory: false

  - name: "power-profiles-daemon.service"
    action: "enable"
    mandatory: false

  - name: "pci-latency.service"
    action: "enable"
    mandatory: false

  # Security
  - name: "ufw.service"
    action: "enable"
    mandatory: false

  # Peripherals & Hardware
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false

  - name: "cups.socket"
    action: "enable"
    mandatory: false

  # Storage Maintenance
  - name: "fstrim.timer"
    action: "enable"
    mandatory: false

  # Virtualization Guests (QEMU / VirtualBox / VMware)
  - name: "qemu-guest-agent.service"
    action: "enable"
    mandatory: false

  - name: "vboxservice.service"
    action: "enable"
    mandatory: false

  - name: "vmtoolsd.service"
    action: "enable"
    mandatory: false

  - name: "vmware-vmblock-fuse.service"
    action: "enable"
    mandatory: false
