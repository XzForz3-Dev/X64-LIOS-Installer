#
# Configuración del Selector de Bootloader para X64 LIOS Linux
---
mode: required

method: legacy

labels:
    step: "Bootloader"
    step[es]: "Gestor de Arranque"
    step[ru]: "Загрузчик"
    step[pt_BR]: "Gerenciador de Inicialização"

default: limine

items:
    - id: limine
      name: "Limine"
      description: "Gestor de arranque multiprotocolo moderno, avanzado y ultrarrápido. Incluye soporte nativo para snapshots BTRFS desde el menú de arranque, compatible tanto con BIOS como con UEFI y dual-boot con Windows."
      description[en]: "Modern, advanced, and portable multiprotocol bootloader. Native Btrfs snapshot rollback integration out of the box, support for both BIOS and UEFI, and automatic Windows dual-boot."
      screenshot: "/etc/calamares/images/bootloaders/limine.png"

    - id: grub
      name: "GRUB"
      platform: "desktop"
      description: "El gestor de arranque más maduro, robusto y utilizado en Linux. Gran cantidad de funciones, altamente probado, soporte completo para particiones cifradas /boot y restauración con snapshots BTRFS."
      description[en]: "The most mature, robust, and widely used Linux boot manager. Feature-rich, highly tested, with full support for encrypted /boot and Btrfs snapshots."
      screenshot: "/etc/calamares/images/bootloaders/grub.png"

    - id: systemd-boot
      name: "systemd-boot"
      efiOnly: true
      description: "Gestor de arranque UEFI minimalista, simple y ultrarrápido integrado en systemd. Diseño ligero y confiable sin sobrecarga, ideal para placas base modernas con arranque UEFI puro."
      description[en]: "Minimalist, simple, and blazing fast UEFI boot manager integrated into systemd. Clean, reliable design without overhead, perfect for modern pure UEFI motherboards."
      screenshot: "/etc/calamares/images/bootloaders/systemd-boot.jpg"

    - id: refind
      name: "rEFInd"
      platform: "desktop"
      efiOnly: true
      description: "Gestor de arranque gráfico y elegante con escaneo automático de discos. Detecta dinámicamente cualquier sistema operativo (Linux, Windows, macOS) instalado en tus unidades."
      description[en]: "Polished graphical boot manager with automatic drive scanning. Dynamically detects and displays entries for every operating system installed on your computer."
      screenshot: "/etc/calamares/images/bootloaders/refind.jpg"

