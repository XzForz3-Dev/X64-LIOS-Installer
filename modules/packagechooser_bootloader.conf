#
# Bootloader Chooser configuration for X64 LIOS Linux
---
mode: required

method: legacy

labels:
    step: "Bootloader"

default: limine

items:
    - id: limine
      name: "Limine"
      description: "Modern, advanced, and portable multiprotocol bootloader. Native Btrfs snapshot rollback integration out of the box, support for both BIOS and UEFI, and automatic Windows dual-boot."
      screenshot: "/etc/calamares/images/bootloaders/limine.png"

    - id: grub
      name: "GRUB"
      platform: "desktop"
      description: "The most mature, robust, and widely used Linux boot manager. Feature-rich, highly tested, with full support for encrypted /boot and Btrfs snapshots."
      screenshot: "/etc/calamares/images/bootloaders/grub.png"

    - id: systemd-boot
      name: "systemd-boot"
      efiOnly: true
      description: "Minimalist, simple, and blazing fast UEFI boot manager integrated into systemd. Clean, reliable design without overhead, perfect for modern pure UEFI motherboards."
      screenshot: "/etc/calamares/images/bootloaders/systemd-boot.jpg"

    - id: refind
      name: "rEFInd"
      platform: "desktop"
      efiOnly: true
      description: "Polished graphical boot manager with automatic drive scanning. Dynamically detects and displays entries for every operating system installed on your computer."
      screenshot: "/etc/calamares/images/bootloaders/refind.jpg"
