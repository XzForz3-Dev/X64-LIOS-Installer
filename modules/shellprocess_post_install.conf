#
# Finalize system configuration inside chroot for X64 LIOS Linux
---

dontChroot: false
timeout: 300
script:
    - "-rm /etc/systemd/system/etc-pacman.d-gnupg.mount"
    - command: "/etc/calamares/scripts/dmcheck"
      verbose: true
    - command: "/etc/calamares/scripts/shell-setup ${USER}"
      verbose: true
    - command: "/etc/calamares/scripts/bootloader-post-setup"
      verbose: true
    - "-rm -f /etc/calamares/scripts/dmcheck"
    - "-rm -f /etc/calamares/scripts/shell-setup"
    - "-rm -f /etc/calamares/scripts/bootloader-post-setup"

i18n:
    name: "Finalizing system configuration"
