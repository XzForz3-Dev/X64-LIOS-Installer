#
# Configuración del Selector de Escritorio para X64 LIOS Linux
---
mode: required

method: netinstall-select

labels:
    step: "Desktop"
    step[es]: "Escritorio"
    step[de]: "Desktop"
    step[fr]: "Bureau"
    step[ru]: "Рабочий стол"
    step[pt_BR]: "Ambiente de Trabalho"

default: KDE-Desktop

items:
    - id: ""
      name: "No Desktop"
      name[es]: "Sin Escritorio (Servidor / CLI)"
      name[de]: "Kein Desktop"
      name[pt_BR]: "Sem Ambiente de Trabalho"
      description: "Instala únicamente la base del sistema sin entorno gráfico. El sistema arrancará en modo consola (TTY) listo para configurarse como servidor o personalizarse manualmente."
      description[en]: "Installs only the base system without a graphical environment. The system will boot into text mode (TTY) ready to be configured as a server or customized manually."
      screenshot: ":/images/no-selection.png"

    - id: KDE-Desktop
      name: "Plasma Desktop"
      platform: "desktop"
      description: "El entorno oficial y buque insignia de X64 LIOS. Potente, altamente personalizable, moderno y optimizado para gaming con el stack completo de KDE Plasma 6 sobre Wayland."
      description[en]: "The official flagship desktop of X64 LIOS. Powerful, modern, highly customizable, and optimized for gaming with the full KDE Plasma 6 Wayland stack."
      screenshot: "/etc/calamares/images/kde.webp"

    - id: GNOME-Desktop
      name: "GNOME"
      platform: "desktop"
      description: "Una experiencia de usuario limpia, centrada y elegante. Diseñado con una interfaz moderna basada en gestos y un flujo de trabajo sin distracciones."
      description[en]: "A clean, focused, and elegant user experience. Designed with a modern gesture-driven interface and a distraction-free workflow."
      screenshot: "/etc/calamares/images/gnome.webp"

    - id: Cosmic
      name: "COSMIC"
      platform: "desktop"
      description: "El revolucionario entorno de escritorio de próxima generación desarrollado en Rust por System76. Modular, ultrarrápido y con soporte nativo de auto-tiling."
      description[en]: "The next-generation desktop environment developed in Rust by System76. Modular, blazing fast, with native auto-tiling support."
      screenshot: "/etc/calamares/images/cosmic.webp"

    - id: Niri
      name: "Niri"
      platform: "desktop"
      description: "Compositor Wayland moderno de mosaico con desplazamiento infinito (scrollable tiling). Flujo de trabajo innovador en cinta horizontal."
      description[en]: "A modern scrollable-tiling Wayland compositor. Innovative horizontal ribbon workflow."
      screenshot: "/etc/calamares/images/niri.webp"

    - id: Cinnamon
      name: "Cinnamon"
      platform: "desktop"
      description: "Experiencia de escritorio tradicional, intuitiva y robusta. Perfecto para usuarios que prefieren la disposición clásica con panel inferior y menú de inicio."
      description[en]: "Traditional, intuitive, and robust desktop experience. Perfect for users who prefer the classic layout with bottom panel and start menu."
      screenshot: "/etc/calamares/images/cinnamon.jxl"

    - id: Xfce4
      name: "Xfce4"
      platform: "desktop"
      description: "Entorno de escritorio ligero y ultra-rápido para sistemas tipo UNIX. Máximo rendimiento y mínimo consumo de memoria RAM."
      description[en]: "Lightweight and ultra-fast desktop environment for UNIX-like systems. Maximum performance and minimal RAM consumption."
      screenshot: "/etc/calamares/images/xfce.jxl"

    - id: Hyprland
      name: "Hyprland"
      platform: "desktop"
      description: "Compositor Wayland de mosaico dinámico (dynamic tiling) de alto rendimiento. Animaciones fluidas, esquinas redondeadas y estética hacker moderna."
      description[en]: "High-performance dynamic tiling Wayland compositor. Smooth animations, rounded corners, and a modern hacker aesthetic."
      screenshot: "/etc/calamares/images/hyprland.webp"

