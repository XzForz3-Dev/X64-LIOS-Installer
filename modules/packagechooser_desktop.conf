#
# Desktop Chooser configuration for X64 LIOS Linux
---
mode: required

method: netinstall-select

labels:
    step: "Desktop"

default: KDE-Desktop

items:
    - id: "X64-Server-Core"
      name: "No Desktop (Server / CLI)"
      description: "Installs only the base system without a graphical environment. The system will boot into text mode (TTY) ready to be configured as a server or customized manually."
      screenshot: ":/images/no-selection.png"

    - id: KDE-Desktop
      name: "Plasma Desktop"
      platform: "desktop"
      description: "The official flagship desktop of X64 LIOS. Powerful, modern, highly customizable, and optimized for gaming with the full KDE Plasma 6 Wayland stack."
      screenshot: "/etc/calamares/images/kde.webp"

    - id: GNOME-Desktop
      name: "GNOME"
      platform: "desktop"
      description: "A clean, focused, and elegant user experience. Designed with a modern gesture-driven interface and a distraction-free workflow."
      screenshot: "/etc/calamares/images/gnome.webp"

    - id: Cosmic
      name: "COSMIC"
      platform: "desktop"
      description: "The next-generation desktop environment developed in Rust by System76. Modular, blazing fast, with native auto-tiling support."
      screenshot: "/etc/calamares/images/cosmic.webp"

    - id: Niri
      name: "Niri"
      platform: "desktop"
      description: "A modern scrollable-tiling Wayland compositor. Innovative horizontal ribbon workflow."
      screenshot: "/etc/calamares/images/niri.webp"

    - id: Cinnamon
      name: "Cinnamon"
      platform: "desktop"
      description: "Traditional, intuitive, and robust desktop experience. Perfect for users who prefer the classic layout with bottom panel and start menu."
      screenshot: "/etc/calamares/images/cinnamon.jxl"

    - id: Xfce4
      name: "Xfce4"
      platform: "desktop"
      description: "Lightweight and ultra-fast desktop environment for UNIX-like systems. Maximum performance and minimal RAM consumption."
      screenshot: "/etc/calamares/images/xfce.jxl"

    - id: Hyprland
      name: "Hyprland"
      platform: "desktop"
      description: "High-performance dynamic tiling Wayland compositor. Smooth animations, rounded corners, and a modern hacker aesthetic."
      screenshot: "/etc/calamares/images/hyprland.webp"
