# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
### pacstrap Module for X64 LIOS Linux
#
# This module installs the base system packages and copies configuration
# files into the target root partition.
#
---
basePackages:
  - base
  - base-devel
  - btrfs-progs
  - cachyos-hooks
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-rate-mirrors
  - cachyos-settings
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - chwd
  - mkinitcpio
  - netctl
  - os-prober
  - perl
  - python
  - s-nail
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - which
  - xfsprogs
  - plymouth
  - falcond
  - falcond-profiles
  - ananicy-cpp
  - cachyos-ananicy-rules
  - zram-generator
  - x64-welcome

postInstallFiles:
  - "/etc/mkinitcpio.conf"
  - "/etc/calamares/scripts/dmcheck"
  - "/etc/calamares/scripts/bootloader-post-setup"
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/btrfs-installation-snapshot"

