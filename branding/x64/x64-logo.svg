<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sombra general para darle un efecto premium de "app" -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Máscara para que la sombra de la flecha no se salga del cuadrado -->
    <clipPath id="square-clip">
      <rect x="20" y="10" width="60" height="60" rx="4" />
    </clipPath>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- 1. Cuadrado Principal (Ahora en Rojo X64) -->
    <rect x="20" y="10" width="60" height="60" fill="#cc0000" rx="4" />
    
    <!-- Sombra larga de la flecha (Estilo Material Design), recortada al cuadrado -->
    <polygon points="50,56 66,40 100,74 100,100 50,100" fill="#000000" fill-opacity="0.2" clip-path="url(#square-clip)" />
    
    <!-- 2. Flecha Blanca de Instalación -->
    <polygon points="44,20 56,20 56,40 66,40 50,56 34,40 44,40" fill="#ffffff" />
    
    <!-- 3. Rectángulo Inferior (Ahora en Oscuro Hacker) -->
    <!-- Fondo oscuro -->
    <rect x="10" y="60" width="80" height="30" fill="#151515" rx="4" />
    <!-- Brillo superior sutil para dar volumen al rectángulo oscuro -->
    <path d="M 14,60 L 86,60" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" />
    
    <!-- 4. Barra de Progreso / Nodos -->
    <!-- Línea roja (progreso) -->
    <line x1="25" y1="75" x2="50" y2="75" stroke="#ff1a1a" stroke-width="4" stroke-linecap="round" />
    <!-- Línea gris (restante) -->
    <line x1="50" y1="75" x2="75" y2="75" stroke="#444444" stroke-width="4" stroke-linecap="round" />
    
    <!-- Nodos -->
    <circle cx="25" cy="75" r="6" fill="#ff1a1a" />
    <circle cx="50" cy="75" r="6" fill="#ff1a1a" />
    <circle cx="75" cy="75" r="6" fill="#444444" />
  </g>
</svg>
